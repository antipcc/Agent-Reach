name: Woo
options:
  bundleIdPrefix: app.woo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  WooKit:
    path: WooKit

targets:
  Woo:
    type: application
    platform: iOS
    sources:
      - path: Woo
    dependencies:
      - package: WooKit
        product: WooKit
    info:
      path: Woo/Info.plist
      properties:
        CFBundleDisplayName: Woo
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: Woo uses the camera to photograph the outfit you are wearing today.
        NSPhotoLibraryAddUsageDescription: Woo saves the looks you generate to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.woo.Woo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  WooKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WooKit/Tests/WooKitTests
    dependencies:
      - package: WooKit
        product: WooKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Woo:
    build:
      targets:
        Woo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WooKitTests
