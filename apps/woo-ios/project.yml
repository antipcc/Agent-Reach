name: Woo
options:
  bundleIdPrefix: app.woo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  WooKit:
    path: WooKit

targets:
  Woo:
    type: application
    platform: iOS
    sources:
      - path: Woo
    dependencies:
      - package: WooKit
        product: WooKit
    info:
      path: Woo/Info.plist
      properties:
        CFBundleDisplayName: Woo
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: Woo 用相机拍下你今天穿的这一套。
        NSPhotoLibraryAddUsageDescription: Woo 会把生成的造型保存到你的相册。
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  WooKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WooKit/Tests/WooKitTests
    dependencies:
      - package: WooKit
        product: WooKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Woo:
    build:
      targets:
        Woo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WooKitTests
